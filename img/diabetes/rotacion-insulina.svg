<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><rect width="1400" height="1000" rx="26" fill="#fffdf6"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#24473d}.title{font-size:38px;font-weight:bold;fill:#064e3b}.small{font-size:18px}.label{font-size:22px;font-weight:bold}.body{fill:#f1dcc4;stroke:#a78c72;stroke-width:3;stroke-linejoin:round}.zone{stroke-width:2;stroke:#fff;opacity:.95}</style><text x="54" y="62" class="small" fill="#087f5b">ENDONUTRI · EDUCACIÓN DIABETOLÓGICA</text><text x="54" y="113" class="title">Cada pinchazo, en un punto diferente</text><text x="54" y="154" font-size="22">Zonas de inyección de insulina y rotación sistemática</text><g transform="translate(245 220)"><circle class="body" cx="0" cy="22" r="35"/><rect class="body" x="-20" y="51" width="40" height="33"/><path class="body" d="M -26 61 Q -30 75 -63 83 Q -74 89 -77 114 L -97 251 Q -96 269 -85 272 Q -72 274 -70 257 L -53 146 L -44 209 Q -42 234 -48 260 Q -57 278 -51 314 L -45 423 Q -47 433 -66 441 Q -71 451 -57 454 L -23 454 Q -17 450 -18 435 L -9 321 L 0 296 L 9 321 L 18 435 Q 17 450 23 454 L 57 454 Q 71 451 66 441 Q 47 433 45 423 L 51 314 Q 57 278 48 260 Q 42 234 44 209 L 53 146 L 70 257 Q 72 274 85 272 Q 96 269 97 251 L 77 114 Q 74 89 63 83 Q 30 75 26 61 Z"/><rect class="zone" x="-38" y="182" width="76" height="68" rx="17" fill="#31a37b"/><path d="M0 183v66M-37 216h74" stroke="#fff" stroke-width="2"/><circle cx="0" cy="216" r="13" fill="#fffdf6" stroke="#a78c72" stroke-width="1.8"/><circle cx="0" cy="216" r="2.5" fill="#a78c72"/><ellipse class="zone" cx="-35" cy="294" rx="16" ry="31" fill="#cc9949"/><ellipse class="zone" cx="35" cy="294" rx="16" ry="31" fill="#cc9949"/></g><g transform="translate(515 220)"><circle class="body" cx="0" cy="22" r="35"/><rect class="body" x="-20" y="51" width="40" height="33"/><path class="body" d="M -26 61 Q -30 75 -63 83 Q -74 89 -77 114 L -97 251 Q -96 269 -85 272 Q -72 274 -70 257 L -53 146 L -44 209 Q -42 234 -48 260 Q -57 278 -51 314 L -45 423 Q -47 433 -66 441 Q -71 451 -57 454 L -23 454 Q -17 450 -18 435 L -9 321 L 0 296 L 9 321 L 18 435 Q 17 450 23 454 L 57 454 Q 71 451 66 441 Q 47 433 45 423 L 51 314 Q 57 278 48 260 Q 42 234 44 209 L 53 146 L 70 257 Q 72 274 85 272 Q 96 269 97 251 L 77 114 Q 74 89 63 83 Q 30 75 26 61 Z"/><ellipse class="zone" cx="-73" cy="152" rx="13" ry="31" transform="rotate(8 -73 152)" fill="#649eb6"/><ellipse class="zone" cx="73" cy="152" rx="13" ry="31" transform="rotate(-8 73 152)" fill="#649eb6"/><path class="zone" d="M-45 257q19 -11 30 3l-5 24q-12 10 -29 -4z" fill="#a589ba"/><path class="zone" d="M45 257q-19 -11 -30 3l5 24q12 10 29 -4z" fill="#a589ba"/></g><text x="245" y="720" text-anchor="middle" class="label">POR DELANTE</text><text x="515" y="720" text-anchor="middle" class="label">POR DETRÁS</text><circle cx="775" cy="223" r="22" fill="#31a37b"/><text x="775" y="231" text-anchor="middle" font-size="22" font-weight="bold" fill="white">1</text><text x="815" y="223" class="label">Abdomen</text><text x="815" y="252" class="small">Divide en 4 sectores; evita el ombligo.</text><circle cx="775" cy="303" r="22" fill="#cc9949"/><text x="775" y="311" text-anchor="middle" font-size="22" font-weight="bold" fill="white">2</text><text x="815" y="303" class="label">Muslos</text><text x="815" y="332" class="small">Zona anterior y externa del tercio superior.</text><circle cx="775" cy="383" r="22" fill="#649eb6"/><text x="775" y="391" text-anchor="middle" font-size="22" font-weight="bold" fill="white">3</text><text x="815" y="383" class="label">Brazos</text><text x="815" y="412" class="small">Zona posterior media de la parte superior.</text><circle cx="775" cy="463" r="22" fill="#a589ba"/><text x="775" y="471" text-anchor="middle" font-size="22" font-weight="bold" fill="white">4</text><text x="815" y="463" class="label">Glúteos</text><text x="815" y="492" class="small">Zona superior y externa de cada lado.</text><rect x="741" y="547" width="603" height="186" rx="20" fill="#edf5e9"/><text x="765" y="580" class="label">Un sector cada semana</text><rect x="766" y="604" width="122" height="102" rx="8" fill="#31a37b"/><path d="M827 604v102M766 655h122" stroke="white" stroke-width="2"/><g fill="white" font-size="21" font-weight="bold"><text x="789" y="638">1</text><text x="851" y="638">2</text><text x="851" y="690">3</text><text x="789" y="690">4</text></g><text x="915" y="620" class="small">Avanza siempre en el mismo sentido.</text><text x="915" y="653" class="small">Dentro del sector, separa los puntos</text><text x="915" y="686" font-size="23" font-weight="bold">al menos 1 cm.</text><rect x="54" y="764" width="1290" height="150" rx="19" fill="#fff4da"/><text x="78" y="800" class="label">Solo basal</text><text x="78" y="832" class="small">Zona sana y accesible; rota los puntos.</text><text x="78" y="860" class="small">No es obligatorio usar muslo o glúteo</text><text x="78" y="888" class="small">con todos los análogos basales.</text><path d="M692 785v108" stroke="#ddcaa1"/><text x="719" y="800" class="label">Basal-bolo</text><text x="719" y="832" class="small">Puedes reservar sectores para cada insulina.</text><text x="719" y="860" class="small">Es una ayuda para organizarse, no una regla fija.</text><text x="719" y="888" class="small">Con NPH/regular, mantén región y horario estables.</text><text x="54" y="948" font-size="17">Piel sana · Aguja nueva · Evitar bultos · Revisar técnica y ficha del medicamento</text><text x="54" y="978" font-size="14">Esquema orientativo de adultos. Fuentes: FITTER Forward 2025; FIT selección y rotación; recomendaciones FITTER 2016.</text></svg>