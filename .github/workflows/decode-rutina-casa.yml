name: Decode rutina casa final image
on:
  push:
    paths:
      - '.github/workflows/decode-rutina-casa.yml'
  workflow_dispatch:

# Trigger refresh: 2026-10-11
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode final abdominales principiante image
        run: |
          base64 -d "_upload/abdominales-principiante-final.b64" > "img/rutina-casa/abdominales-principiante.webp"
      - name: Commit final image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/rutina-casa/abdominales-principiante.webp
          git commit -m "Actualiza abdominales principiante con la imagen final" || exit 0
          git push
