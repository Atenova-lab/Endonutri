name: Publicar rutina casa HQ
on:
  push:
    paths:
      - '.github/workflows/publish-rutina-hq.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Descargar las cinco láminas aprobadas en alta calidad
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p img/rutina-casa
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/5ca0d1c6-e8b6-494d-959f-7a8110571002.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMzdjNWNmNDBkNWM2NjZkMCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTg0ODEyOH0.vi_MS9mACY0bJlJte6AHR8mw_PqzaTGdWk6xu_cJ250' -o img/rutina-casa/rutina-dia-1.webp
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/cf96a83c-bae9-43ad-aa20-cb419f710f31.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZmFlN2MyMzlhODRlNzZjMSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTg0NzczN30.gfCqkG2fNy3lwYhCFh5qDwXmr-pMGv7GpkYEO_1A2QM' -o img/rutina-casa/rutina-dia-2.webp
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/c38c2bde-b03a-49e4-b990-c548772dac27.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiY2RiZWFkYzU5ZDc5NWQ3OSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTgyMjQwNX0.Adfpvu7bdf6hpA1xmdestnaiQIjpWLAxr9i961jFt1U' -o img/rutina-casa/rutina-dia-3.webp
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/83ef0e35-2f25-4209-8de4-536594571bc4.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMWE1NDM2ODU5YzAyMTJkOCIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTgxMjk5N30.EpFZ9YDf-o2lZfab-CntVPrrpWyteM-rHMoRbnzQYFM' -o img/rutina-casa/abdominales-principiante.webp
          curl -L --fail --retry 3 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/f0a1f576-553d-4280-8b89-52726dab753a.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiODRhYWM1OGYyNmY4NjQ5NSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTc5NzAwN30.yuG1qVyJIYLkgRVFFthXRszyIPvOevaTurJafplM4po' -o img/rutina-casa/abdominales-progresion.webp
          file img/rutina-casa/*.webp
          test $(stat -c%s img/rutina-casa/rutina-dia-1.webp) -gt 150000
          test $(stat -c%s img/rutina-casa/rutina-dia-2.webp) -gt 150000
          test $(stat -c%s img/rutina-casa/rutina-dia-3.webp) -gt 150000
          test $(stat -c%s img/rutina-casa/abdominales-principiante.webp) -gt 150000
          test $(stat -c%s img/rutina-casa/abdominales-progresion.webp) -gt 150000
      - name: Publicar binarios reales
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add img/rutina-casa/rutina-dia-1.webp img/rutina-casa/rutina-dia-2.webp img/rutina-casa/rutina-dia-3.webp img/rutina-casa/abdominales-principiante.webp img/rutina-casa/abdominales-progresion.webp
          git commit -m 'Sustituye guías de ejercicio por versiones HQ' || exit 0
          git push
